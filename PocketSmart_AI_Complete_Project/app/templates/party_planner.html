{% extends 'base.html' %}{% block title %}Party Planner — PocketSmart AI{% endblock %}{% block content %}<section class="planner"><div class="page-head"><div><p class="eyebrow">Planner 02</p><h1>Party Budget</h1><p>Split spending across food, décor, entertainment and accommodation.</p></div></div><form id="partyForm" class="form-card"><div class="grid2"><label>Budget (₹)<input type="number" id="budget" min="1" required></label><label>Guests<input type="number" id="guests" min="1" required></label><label>Event type<select id="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Family gathering</option><option>Anniversary</option></select></label><label>Venue preference<input id="venue" value="flexible"></label><label>City<input id="city" value="Chennai"></label></div><label>Preferences<textarea id="preferences">balanced food, decor and entertainment</textarea></label><button class="btn primary" type="submit">Generate party plan</button><p id="error" class="error"></p></form><div id="result"></div></section>{% endblock %}
