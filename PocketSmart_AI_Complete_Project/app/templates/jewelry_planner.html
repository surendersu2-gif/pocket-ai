{% extends 'base.html' %}{% block title %}Jewelry Planner — PocketSmart AI{% endblock %}{% block content %}<section class="planner"><div class="page-head"><div><p class="eyebrow">Planner 03</p><h1>Jewelry Match</h1><p>Describe the occasion and optionally upload an outfit image for visual matching.</p></div></div><form id="jewelryForm" class="form-card" enctype="multipart/form-data"><div class="grid2"><label>Budget (₹)<input type="number" id="budget" min="1" required></label><label>Occasion<input id="occasion" placeholder="Wedding reception" required></label><label>Style<select id="style"><option>Elegant</option><option>Traditional</option><option>Minimal</option><option>Statement</option><option>Contemporary</option></select></label><label>Outfit color<input id="outfit_color" placeholder="Emerald green"></label><label>Metal preference<select id="metal"><option>Any</option><option>Gold-tone</option><option>Silver-tone</option><option>Rose gold</option></select></label></div><label>Preferences<textarea id="preferences">comfortable and versatile</textarea></label><label>Outfit image (optional)<input type="file" id="outfit_image" accept="image/jpeg,image/png,image/webp"></label><button class="btn primary" type="submit">Generate jewelry plan</button><p id="error" class="error"></p></form><div id="result"></div></section>{% endblock %}
